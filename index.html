<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecryptique Dark IA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
    }

    body {
      background-color: #f7f7f8;
      color: #1f1f1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER FIXE */
    .header {
      position: fixed;
      top: 0;
      border-radius: 7px;
      left: 0;
      width: 100%;
      height: 64px;
      background: linear-gradient(90deg, #0066FF, #00CC66, #FF7A00);
      backdrop-filter: blur(8px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
    }

    .menu-button, .newchat-button {
      position: absolute;
      top: 14px;
      font-size: 24px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
      z-index: 1201;
    }

    .menu-button { left: 18px; }
    .newchat-button { right: 18px; }

    .menu-button:hover, .newchat-button:hover {
      transform: scale(1.1);
      color: #10a37f;
    }

    /* MENU LATERAL */
    .side-menu {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100%;
      background: #111;
      color: white;
      transition: left 0.3s ease;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      padding: 80px 20px 70px;
    }

    .side-menu.active { left: 0; }

    .close-button {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 26px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: none;
      transition: 0.2s;
      z-index: 1300;
    }

    .close-button:hover { color: #10a37f; }
    .side-menu.active ~ .close-button { display: block; }

    .side-menu h2 {
      font-size: 18px;
      margin-bottom: 12px;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      padding: 10px;
      background: #1f1f1f;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      word-break: break-word;
    }

    .history-item:hover {
      background: #10a37f;
    }

    .clear-button {
      background: #c00;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.2s;
    }

    .clear-button:hover { background: #900; }

    /* CONTENU PRINCIPAL */
    .container {
      margin-top: 80px;
      max-width: 768px;
      margin-left: auto;
      margin-right: auto;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 400px;
    }

    .welcome-screen img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .greeting { font-size: 28px; font-weight: 600; margin-bottom: 10px; }
    .description { font-size: 18px; color: #565869; }

    .message {
      display: flex;
      gap: 12px;
      padding: 14px;
      background-color: white;
      border-radius: 12px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { background-color: #f0f0f0; margin-left: 40px; }
    .message.bot { margin-right: 40px; }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .message.bot .message-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message.user .message-avatar {
      background-color: #565869;
      color: white;
      font-weight: bold;
    }

    .message-content {
      flex: 1;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .typing-indicator {
      display: none;
      padding: 16px;
      background-color: white;
      border-radius: 12px;
      margin-right: 40px;
      gap: 12px;
    }

    .typing-indicator.active { display: flex; }

    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-left: 44px;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10a37f;
      animation: bounce 1.4s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }

    .input-container {
      position: relative;
      margin-bottom: 30px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border-radius: 16px;
      background-color: white;
      border: 2px solid transparent;
      border-image: linear-gradient(90deg, #0066FF, #00CC66, #FF7A00);
      border-image-slice: 1;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 204, 102, 0.5);
    }

    .message-input {
      width: 100%;
      padding: 18px 60px 18px 20px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      background-color: transparent;
      resize: none;
      min-height: 62px;
      max-height: 200px;
      outline: none;
      line-height: 1.5;
    }

    .send-button {
      position: absolute;
      right: 18px;
      bottom: 18px;
      background: #ff7a00;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 22px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .send-button:hover { background-color: #0d8c6d; }

    @media (max-width: 768px) {
      .container { padding: 16px; }
      .header h1 { font-size: 18px; }
      .side-menu { width: 240px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="menu-button" id="menuToggle">☰</button>
    <h1>Lecryptique Dark IA</h1>
    <button class="newchat-button" id="newChat">＋</button>
  </div>

  <div class="side-menu" id="sideMenu">
    <h2>Historique</h2>
    <div class="history" id="historyList"></div>
    <button class="clear-button" id="clearHistory">🗑 Supprimer tout</button>
  </div>

  <button class="close-button" id="closeMenu">×</button>

  <div class="container">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome-screen" id="welcomeScreen">
        <img src="https://i.ibb.co/v4f8HR4z/IMG-20250925-WA0000.jpg" alt="IA Avatar">
        <div class="greeting">Bonjour, je suis Lecryptique dark IA.</div>
        <div class="description">Comment puis-je vous aider aujourd'hui ?</div>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>

    <div class="input-container">
      <textarea class="message-input" id="messageInput" placeholder="Envoyer un message à Lecryptique dark..."></textarea>
      <button class="send-button" id="sendButton">↑</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://lecryptiqueapi.lecryptique.workers.dev/api/chat';
    const chatMessages = document.getElementById('chatMessages');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const textarea = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const typingIndicator = document.getElementById('typingIndicator');
    const menuToggle = document.getElementById('menuToggle');
    const sideMenu = document.getElementById('sideMenu');
    const newChat = document.getElementById('newChat');
    const historyList = document.getElementById('historyList');
    const clearHistory = document.getElementById('clearHistory');
    const closeMenu = document.getElementById('closeMenu');

    let isFirstMessage = true;
    let conversationHistory = [];
    let savedConversations = JSON.parse(localStorage.getItem('darkIA_history')) || [];

    function updateHistoryMenu() {
      historyList.innerHTML = '';
      savedConversations.forEach((conv, index) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.textContent = conv.title || `Conversation ${index + 1}`;
        item.onclick = () => loadConversation(index);
        historyList.appendChild(item);
      });
    }

    function saveConversation() {
      const title = conversationHistory[0]?.content.split(' ')[0] || 'Sans titre';
      savedConversations.push({ title, messages: conversationHistory });
      localStorage.setItem('darkIA_history', JSON.stringify(savedConversations));
      updateHistoryMenu();
    }

    function loadConversation(index) {
      const conv = savedConversations[index];
      if (!conv) return;
      chatMessages.innerHTML = '';
      conv.messages.forEach(m => addMessage(m.content, m.role === 'user'));
      conversationHistory = conv.messages;
      isFirstMessage = false;
      sideMenu.classList.remove('active');
      closeMenu.style.display = 'none';
    }

    clearHistory.onclick = () => {
      localStorage.removeItem('darkIA_history');
      savedConversations = [];
      updateHistoryMenu();
    };

    menuToggle.addEventListener('click', () => {
      sideMenu.classList.add('active');
      closeMenu.style.display = 'block';
    });

    closeMenu.addEventListener('click', () => {
      sideMenu.classList.remove('active');
      closeMenu.style.display = 'none';
    });

    newChat.addEventListener('click', () => {
      if (conversationHistory.length > 0) saveConversation();
      conversationHistory = [];
      chatMessages.innerHTML = `
        <div class="welcome-screen" id="welcomeScreen">
          <img src="https://i.ibb.co/v4f8HR4z/IMG-20250925-WA0000.jpg" alt="IA Avatar">
          <div class="greeting">Bonjour, je suis Lecryptique dark IA.</div>
          <div class="description">Comment puis-je vous aider aujourd'hui ?</div>
        </div>`;
      isFirstMessage = true;
    });

    textarea.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendButton.addEventListener('click', sendMessage);

    function addMessage(content, isUser) {
      if (isFirstMessage) {
        welcomeScreen.style.display = 'none';
        isFirstMessage = false;
      }
      const msg = document.createElement('div');
      msg.className = `message ${isUser ? 'user' : 'bot'}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      if (isUser) avatar.textContent = 'T';
      else {
        const img = document.createElement('img');
        img.src = 'https://i.ibb.co/v4f8HR4z/IMG-20250925-WA0000.jpg';
        avatar.appendChild(img);
      }

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.textContent = content;

      msg.appendChild(avatar);
      msg.appendChild(contentDiv);
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() { typingIndicator.classList.add('active'); }
    function hideTyping() { typingIndicator.classList.remove('active'); }

    async function sendMessage() {
      const message = textarea.value.trim();
      if (!message) return;

      addMessage(message, true);
      textarea.value = '';
      textarea.disabled = true;
      sendButton.disabled = true;

      conversationHistory.push({ role: 'user', content: message });

      // ➤ Ajouter directement la conversation dans l'historique dès le premier message
      if (conversationHistory.length === 1) {
        const title = message.split(' ')[0];
        savedConversations.push({ title, messages: conversationHistory });
        localStorage.setItem('darkIA_history', JSON.stringify(savedConversations));
        updateHistoryMenu();
      }

      showTyping();

      try {
        const response = await fetch(`${API_URL}?prompt=${encodeURIComponent(message)}`);
        const data = await response.json();
        hideTyping();

        const botReply = data.result || 'Erreur: réponse vide.';
        addMessage(botReply, false);
        conversationHistory.push({ role: 'assistant', content: botReply });
      } catch {
        hideTyping();
        addMessage('Erreur de connexion.', false);
      }

      textarea.disabled = false;
      sendButton.disabled = false;
      textarea.focus();
    }

    updateHistoryMenu();
  </script>
</body>
</html>
